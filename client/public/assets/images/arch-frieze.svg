<svg xmlns="http://www.w3.org/2000/svg" width="40" height="36" viewBox="0 0 40 36">
  <!-- Light background matching newsletter section -->
  <rect width="40" height="36" fill="#ffffff"/>
  <!-- Kangura battlement silhouette in pale heritage teal -->
  <path d="M 0,36 L 0,16 C 0,8 5,4 10,4 C 13,4 16,6 20,1.5 C 24,6 27,4 30,4 C 35,4 40,8 40,16 L 40,36 Z" fill="#8bbab8"/>
  <!-- Layered inner cusped arch with translucent glow -->
  <path d="M 4,36 L 4,17 C 4,10 9,7 20,7 C 31,7 36,10 36,17 L 36,36 Z" fill="#abd3d1"/>
  <!-- Dark footer entrance arch -->
  <path d="M 8,36 L 8,20 C 8,13 13,10.5 20,10.5 C 27,10.5 32,13 32,20 L 32,36 Z" fill="#0a1815"/>
  <!-- Finials and pearl beads -->
  <circle cx="20" cy="3.5" r="2.2" fill="#ffffff"/>
  <circle cx="20" cy="3.5" r="1.2" fill="#d99f43"/>
  <circle cx="20" cy="15" r="1.8" fill="#ffffff" opacity="0.95"/>
  <!-- Horizontal joining bar at the bottom -->
  <rect x="0" y="33" width="40" height="3" fill="#0a1815"/>
</svg>
